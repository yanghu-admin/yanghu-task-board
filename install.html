<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>南联养护 · 安装引导</title>
<meta name="theme-color" content="#2C6E8F">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-title" content="南联养护">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F7F7F7;
    color: #1A1B1C;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 20px 32px;
    text-align: center;
  }
  .logo img {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    box-shadow: 0 4px 16px rgba(44,110,143,0.18);
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 18px 0 4px;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 14px;
    color: #6B7280;
    margin: 0 0 32px;
  }
  .btn-enter {
    display: block;
    width: 100%;
    padding: 17px 0;
    background: #2C6E8F;
    color: #fff;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    box-shadow: 0 4px 14px rgba(44,110,143,0.28);
    transition: background 0.15s;
  }
  .btn-enter:active { background: #1F5570; }
  .divider {
    display: flex;
    align-items: center;
    margin: 34px 0 20px;
    color: #9CA3AF;
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #E5E7EB;
  }
  .divider span { padding: 0 14px; white-space: nowrap; }
  .steps {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.05);
  }
  .step-num {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2C6E8F;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
  }
  .step-text { font-size: 14px; color: #1A1B1C; line-height: 1.5; }
  .platforms {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .platform {
    flex: 1 1 140px;
    min-width: 0;
    padding: 12px 14px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.05);
    text-align: left;
  }
  .platform-title {
    font-size: 13px;
    font-weight: 600;
    color: #1A1B1C;
    margin-bottom: 6px;
  }
  .platform-text {
    font-size: 12px;
    color: #6B7280;
    line-height: 1.7;
  }
  .warning {
    margin-top: 20px;
    padding: 12px 14px;
    background: rgba(212,56,13,0.07);
    border: 1px solid rgba(212,56,13,0.22);
    border-radius: 12px;
    font-size: 13px;
    color: #D4380D;
    line-height: 1.6;
    text-align: left;
  }
  .footer {
    margin-top: 28px;
    font-size: 11px;
    color: #9CA3AF;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="/icons/icon-512.png" alt="南联养护">
  </div>
  <h1>南联养护</h1>

  <a href="/index.html" class="btn-enter">进入系统</a>

  <div class="divider"><span>安装到手机桌面（推荐）</span></div>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">用手机自带浏览器打开本页</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">浏览器菜单 → "添加到主屏幕"</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">桌面出现"南联养护"图标，点开即用</div>
    </div>
  </div>

  <div class="platforms">
    <div class="platform">
      <div class="platform-title">安卓（Chrome / Edge）</div>
      <div class="platform-text">右上角 ⋮<br/>→ "添加到主屏幕"<br/>或 "安装应用"</div>
    </div>
    <div class="platform">
      <div class="platform-title">苹果（Safari）</div>
      <div class="platform-text">底部分享 □<br/>→ "添加到主屏幕"<br/>→ 右上角"添加"</div>
    </div>
  </div>

  <div class="warning">
    ⚠ 请用手机自带浏览器打开本页。微信内置浏览器没有"添加到主屏幕"功能，无法安装到桌面。
  </div>

  <div class="footer">南平联络线高速公路养护管理系统</div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js').catch(function() {});
  }
</script>
</body>
</html>
