name: 处理经办人反馈
on:
  issues:
    types: [opened]

jobs:
  process-feedback:
    if: startsWith(github.event.issue.title, '[反馈]')
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析 Issue 内容
        id: parse
        uses: actions/github-script@v6
        with:
          script: |
            const body = context.payload.issue.body;
            const title = context.payload.issue.title;
            
            // 从 Issue body 提取字段
            const taskId = body.match(/\*\*任务编号\*\*:\s*(\S+)/)?.[1];
            const typeLabel = body.match(/\*\*反馈类型\*\*:\s*(\S+)/)?.[1];
            const reporter = body.match(/\*\*提交人\*\*:\s*(.+)/)?.[1];
            const notes = body.match(/\*\*备注\*\*:\s*(.+)/)?.[1];
            const updateStatus = body.match(/\*\*更新状态\*\*:\s*(\S+)/)?.[1];
            const fileStr = body.match(/\*\*照片文件\*\*:\s*(.+)/)?.[1];
            
            // 计算阶段名
            let imageType = 'during';
            if (typeLabel === '维修后') imageType = 'after';
            
            core.setOutput('task_id', taskId || '');
            core.setOutput('image_type', imageType);
            core.setOutput('reporter', reporter || '');
            core.setOutput('notes', notes || '无');
            core.setOutput('update_status', updateStatus || 'processing');
            core.setOutput('file_names', fileStr || '');

      - name: 读取并更新 data.json
        run: |
          TASK_ID="${{ steps.parse.outputs.task_id }}"
          IMAGE_TYPE="${{ steps.parse.outputs.image_type }}"
          UPDATE_STATUS="${{ steps.parse.outputs.update_status }}"
          
          # 用 Python 更新 data.json
          python3 -c "
          import json, os
          
          with open('data.json', 'r') as f:
              data = json.load(f)
          
          for task in data['tasks']:
              if task['id'] == '$TASK_ID':
                  # 下载 Issue 中的图片
                  import subprocess
                  issue_number = ${{ github.event.issue.number }}
                  owner = '${{ github.repository_owner }}'
                  repo = '${{ github.event.repository.name }}'
                  
                  # 获取 Issue 中的图片 URL
                  result = subprocess.run([
                      'gh', 'issue', 'view', str(issue_number),
                      '--repo', f'{owner}/{repo}',
                      '--json', 'body'
                  ], capture_output=True, text=True)
                  
                  # 更新状态
                  if task['status'] != 'completed':
                      task['status'] = '$UPDATE_STATUS'
                  
                  if '$UPDATE_STATUS' == 'completed':
                      from datetime import datetime, timezone
                      task['completed_at'] = datetime.now(timezone.utc).isoformat()
                  
                  # 检查超时
                  if task.get('deadline') and task['status'] != 'completed':
                      from datetime import datetime
                      deadline = datetime.fromisoformat(task['deadline'])
                      now = datetime.now()
                      task['is_overdue'] = now > deadline
                  elif task['status'] == 'completed':
                      task['is_overdue'] = False
                  
                  # 添加备注
                  if '${{ steps.parse.outputs.notes }}' != '无':
                      existing = task.get('notes', '')
                      note = '${{ steps.parse.outputs.notes }}'
                      task['notes'] = (existing + '; ' + note).strip('; ')
                  
                  break
          
          # 重新计算统计
          tasks = data['tasks']
          data['statistics'] = {
              'total': len(tasks),
              'pending': sum(1 for t in tasks if t['status'] == 'pending' and not t['is_overdue']),
              'processing': sum(1 for t in tasks if t['status'] == 'processing'),
              'completed': sum(1 for t in tasks if t['status'] == 'completed'),
              'overdue': sum(1 for t in tasks if t['is_overdue'] and t['status'] != 'completed')
          }
          data['last_updated'] = datetime.now().isoformat()
          
          with open('data.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          "

      - name: 提交更新
        run: |
          git config user.name "yanghu-bot"
          git config user.email "bot@yanghu.com"
          git add data.json
          git commit -m "auto: ${{ steps.parse.outputs.task_id }} feedback processed" || echo "无变更"
          git push

      - name: 关闭 Issue 并回复
        uses: actions/github-script@v6
        with:
          script: |
            const taskId = '${{ steps.parse.outputs.task_id }}';
            const reporter = '${{ steps.parse.outputs.reporter }}';
            const typeLabel = '${{ steps.parse.outputs.image_type }}' === 'during' ? '维修中' : '维修后';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ 已处理！\n\n任务 ${taskId} 的 ${typeLabel} 反馈已更新到看板。\n👉 https://yanghu-admin.github.io/yanghu-task-board/\n\n感谢 ${reporter} 的反馈！`
            });
            
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: ['反馈已处理']
            });
